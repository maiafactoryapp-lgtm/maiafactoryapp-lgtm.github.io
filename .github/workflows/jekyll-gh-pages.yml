<title>MAIA Factory — Software & Tecnologia</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#192332;--line:#33445a;--ink:#f4f7fc;--muted:#b5c4d6;--blue:#8bbaff;--accent:#275da7}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--blue);text-underline-offset:4px}a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:4px}.wrap{width:min(1100px,calc(100% - 40px));margin:auto}header{border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:19px 0}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:800;letter-spacing:.08em}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #6599e1;border-radius:12px;background:#224777;color:white;font-size:23px;letter-spacing:0}nav{display:flex;gap:22px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none;font-size:14px}.hero{padding:clamp(50px,8vw,100px) 0;background:radial-gradient(ellipse at 85% 0%,#1c3b66 0%,transparent 65%)}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:750;color:var(--blue)}h1{font-size:clamp(38px,7vw,76px);line-height:1.08;letter-spacing:-.045em;max-width:850px;margin:14px 0 24px}h2{font-size:clamp(25px,4vw,36px);letter-spacing:-.025em;line-height:1.2;margin:0 0 18px}h3{font-size:21px;margin:0 0 10px}p{margin:0 0 16px}.lead{max-width:650px;font-size:clamp(17px,2vw,21px);color:var(--muted)}.btn{display:inline-flex;align-items:center;min-height:48px;padding:11px 20px;border-radius:10px;background:var(--accent);color:white;text-decoration:none;font-weight:700;margin-top:14px}section{padding:48px 0;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}.tile p,.muted{color:var(--muted)}.featured{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:center;background:linear-gradient(135deg,#1b3d69,#192332 75%);border:1px solid #39577c;border-radius:20px;padding:clamp(24px,4vw,40px)}.status{display:inline-block;font-size:12px;color:var(--blue);font-weight:700;margin-bottom:12px;letter-spacing:.04em}.symbol{font-size:44px;color:var(--blue);line-height:1.1;margin-bottom:16px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{border:1px solid #46617e;border-radius:12px;padding:15px;background:#17283f}.fact strong{display:block;font-size:23px}.fact span{font-size:13px;color:var(--muted)}footer{padding:28px 0;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}@media(max-width:650px){.wrap{width:calc(100% - 32px)}.top{align-items:flex-start;flex-direction:column;gap:12px}nav{gap:18px}.featured{grid-template-columns:1fr}section{padding:36px 0}.hero{padding:52px 0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="#inizio"><span class="mark" aria-hidden="true">M</span> MAIA FACTORY</a><nav aria-label="Navigazione principale"><a href="#app">Applicazioni</a><a href="#progetto">Il progetto</a><a href="#privacy">Privacy</a><a href="#supporto">Supporto</a></nav></div></header>
<main id="inizio">
<div class="hero"><div class="wrap"><div class="eyebrow">Software · Tecnologia · Innovazione</div><h1>Strumenti digitali.<br>Progettati per essere utili.</h1><p class="lead">MAIA Factory è un progetto indipendente dedicato allo sviluppo di applicazioni leggere, accessibili e orientate alla privacy.</p><a class="btn" href="#app">Scopri le applicazioni</a></div></div>
<section id="app"><div class="wrap"><div class="eyebrow">Applicazioni Android</div><h2>Il nostro primo progetto</h2><article class="featured"><div><div class="status">VERSIONE 1.0 · IN PREPARAZIONE</div><div class="symbol" aria-hidden="true">+ − × ÷</div><h3>MAIA Calcolatrice</h3><p class="muted">Calcolatrice standard e scientifica, convertitori di unità e strumenti per le operazioni di tutti i giorni. Interfaccia adattiva con tema chiaro e scuro.</p><p>La pubblicazione su Google Play è in preparazione.</p></div><div class="facts"><div class="fact"><strong>12</strong><span>Lingue</span></div><div class="fact"><strong>Offline</strong><span>Funzionamento locale</span></div><div class="fact"><strong>0</strong><span>Pubblicità nella versione attuale</span></div><div class="fact"><strong>Android</strong><span>Smartphone e tablet</span></div></div></article></div></section>
<section id="progetto"><div class="wrap"><div class="eyebrow">Il progetto</div><h2>La nostra direzione</h2><div class="grid"><article class="tile"><div class="symbol" aria-hidden="true">01</div><h3>Semplicità</h3><p>Interfacce chiare e strumenti pensati per l'uso quotidiano.</p></article><article class="tile"><div class="symbol" aria-hidden="true">02</div><h3>Efficienza</h3><p>Applicazioni leggere, progettate per utilizzare le risorse in modo responsabile.</p></article><article class="tile"><div class="symbol" aria-hidden="true">03</div><h3>Privacy</h3><p>Privilegiare il funzionamento locale quando possibile e descrivere con chiarezza il trattamento dei dati.</p></article></div></div></section>
<section id="privacy"><div class="wrap"><h2>Privacy delle applicazioni</h2><div class="tile"><h3>MAIA Calcolatrice</h3><p>L'informativa definitiva sarà disponibile su questo sito prima della pubblicazione dell'applicazione. Per domande sulla privacy è possibile utilizzare il contatto di supporto.</p></div></div></section>
<section id="supporto"><div class="wrap"><div class="eyebrow">Contatti</div><h2>Supporto MAIA Factory</h2><p class="muted">Per informazioni sulle applicazioni o segnalazioni, contattaci via e-mail.</p><a href="mailto:maiafactoryapp@gmail.com">maiafactoryapp@gmail.com</a></div></section>
</main><footer><div class="wrap foot"><span>© 2026 MAIA Factory</span><span>Software e progetti tecnologici indipendenti.</span></div></footer>
</body></html>
